<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MCEYS CUT STUDIO - Professional Creator Suite</title>
    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: #13161f;
            --border-color: #242938;
            --accent: #ff6b35;
            --accent-hover: #ff5419;
            --accent-glow: rgba(255, 107, 53, 0.4);
            --text-main: #f3f5f9;
            --text-muted: #8b93a7;
            --success: #10b981;
            --bg-input: #0e1117;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg-main); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        header { 
            width: 100%;
            padding: 16px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(19, 22, 31, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text-main); }
        .header-logo {
            height: 54px; width: 54px;
            object-fit: cover; border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 14px var(--accent-glow);
        }
        .logo-box { 
            width: 54px; height: 54px; 
            background: linear-gradient(135deg, var(--accent), #ff9f1c); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 900; font-size: 20px; color: #fff; 
        }
        .brand h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }

        .header-right { display: flex; align-items: center; gap: 14px; }
        
        .lang-switch {
            display: flex; background: var(--bg-input);
            border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden;
        }
        .lang-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 6px 10px; font-size: 11px; font-weight: 800; cursor: pointer;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .lang-btn:last-child { border-right: none; }
        .lang-btn.active { background: var(--accent); color: #fff; }

        .main-container {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 40px 20px; text-align: center;
        }
        .studio-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 40px; max-width: 600px; width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .studio-card h2 { font-size: 22px; font-weight: 900; margin-bottom: 12px; color: #fff; }
        .studio-card p { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
        
        .back-btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 12px 24px; background: var(--border-color); color: var(--text-main);
            text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 13px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #32384a; }

        footer { 
            padding: 16px; text-align: center; font-size: 11px; 
            color: var(--text-muted); border-top: 1px solid var(--border-color); 
            background: rgba(19, 22, 31, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <img src="site_logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='flex';">
            <div id="fallback-logo" class="logo-box" style="display: none;">CS</div>
            <h1>MCEYS CUT STUDİO</h1>
        </a>
        <div class="header-right">
            <div class="lang-switch">
                <button class="lang-btn active" id="btn-lang-tr" onclick="setStudioLang('tr')">TR</button>
                <button class="lang-btn" id="btn-lang-en" onclick="setStudioLang('en')">EN</button>
                <button class="lang-btn" id="btn-lang-de" onclick="setStudioLang('de')">DE</button>
                <button class="lang-btn" id="btn-lang-ru" onclick="setStudioLang('ru')">RU</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="studio-card">
            <h2 data-i18n="s_title">WebAssembly Studio Engine Active</h2>
            <p data-i18n="s_desc">Client-side rendering pipeline is fully operational. Load your clips and start cropping your pro vertical highlights.</p>
            <a href="index.html" class="back-btn" data-i18n="s_back">← Ana Sayfaya Dön</a>
        </div>
    </div>

    <footer>
        <p>MCEYS CUT STUDİO &copy; 2026 | All Rights Reserved.</p>
    </footer>

    <script>
        const studioDict = {
            tr: {
                s_title: "WebAssembly Stüdyo Motoru Aktif",
                s_desc: "Tarayıcı tabanlı render hattı tamamen çalışır durumda. Kliplerini yükle ve profesyonel dikey kesitlerini almaya başla.",
                s_back: "← Ana Sayfaya Dön"
            },
            en: {
                s_title: "WebAssembly Studio Engine Active",
                s_desc: "Client-side rendering pipeline is fully operational. Load your clips and start cropping your pro vertical highlights.",
                s_back: "← Back to Home"
            },
            de: {
                s_title: "WebAssembly Studio-Engine Aktiv",
                s_desc: "Die clientseitige Rendering-Pipeline ist voll funktionsfähig. Lade deine Clips hoch.",
                s_back: "← Zurück zur Startseite"
            },
            ru: {
                s_title: "Движок WebAssembly Studio активен",
                s_desc: "Конвейер рендеринга на стороне клиента полностью функционирует.",
                s_back: "← На главную"
            }
        };

        function setStudioLang(lang) {
            localStorage.setItem('mceys_studio_lang', lang);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-lang-' + lang).classList.add('active');

            const dict = studioDict[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (dict[k]) el.innerHTML = dict[k];
            });
        }

        const savedLang = localStorage.getItem('mceys_studio_lang') || 'tr';
        setStudioLang(savedLang);
    </script>
</body>
</html>
