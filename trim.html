<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCEYS TRIM STUDIO - Önizlemeli Hızlı Video Kesici</title>
    
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <meta name="description" content="MCEYS TRIM STUDIO - Tarayıcıda canlı video oynatıcı ve timeline önizlemesiyle kayıpsız video kırpın. WebAssembly ile anında ve ücretsiz.">
    <meta name="keywords" content="video kesici, timeline video kırpma, online video editörü, kayıpsız video trim">
    <link rel="canonical" href="https://www.cutmakeshorts.com/trim.html">

    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: #13161f;
            --bg-input: #0e1117;
            --border-color: #242938;
            --border-focus: #ff6b35;
            --accent: #ff6b35;
            --accent-hover: #ff5419;
            --accent-glow: rgba(255, 107, 53, 0.35);
            --text-main: #f3f5f9;
            --text-muted: #8b93a7;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: radial-gradient(circle at 50% 0%, #171b26 0%, var(--bg-main) 70%); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        header { 
            width: 100%; min-height: 96px; padding: 0 36px; 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(19, 22, 31, 0.92); backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border-color); box-sizing: border-box;
            flex-wrap: wrap; gap: 16px;
        }
        .brand { display: inline-flex; align-items: center; gap: 16px; text-decoration: none; color: inherit; }
        .header-logo { height: 64px; width: 64px; min-width: 64px; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 16px var(--accent-glow); }
        .logo-box { width: 64px; height: 64px; min-width: 64px; background: linear-gradient(135deg, var(--accent), #ff9f1c); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: #fff; box-shadow: 0 4px 16px var(--accent-glow); }
        .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.8px; line-height: 1; }

        .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .nav-pill-group { display: flex; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; padding: 3px; gap: 2px; }
        .nav-link { color: var(--text-muted); text-decoration: none; font-size: 12px; font-weight: 800; padding: 7px 14px; border-radius: 6px; transition: all 0.2s; white-space: nowrap; }
        .nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .nav-link.active { color: #fff; background: #1c2230; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); }
        .header-divider { width: 1px; height: 24px; background: var(--border-color); display: inline-block; }

        .lang-switch { display: flex; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .lang-btn { background: transparent; border: none; color: var(--text-muted); padding: 7px 11px; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s; border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .lang-btn:last-child { border-right: none; }
        .lang-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.04); }
        .lang-btn.active { background: var(--accent); color: #fff; }

        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 36px 20px; width: 100%; }
        .editor-container { width: 100%; max-width: 900px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        
        .custom-file-upload { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px; border: 2px dashed var(--border-color); border-radius: 14px; background: var(--bg-input); cursor: pointer; text-align: center; margin-bottom: 20px; }
        .custom-file-upload:hover { border-color: var(--accent); }
        .hidden-file-input { display: none; }

        .workspace { display: none; margin-top: 10px; }
        .player-frame { width: 100%; max-height: 420px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 16px; display: flex; justify-content: center; }
        .player-frame video { width: 100%; max-height: 420px; outline: none; }

        .timeline-controls { background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
        .timeline-slider { width: 100%; accent-color: var(--accent); cursor: pointer; margin-bottom: 14px; }

        .time-markers { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .marker-group { display: flex; align-items: center; gap: 8px; }
        .marker-btn { background: #1c2230; color: #fff; border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 800; cursor: pointer; }
        .marker-btn:hover { border-color: var(--accent); color: var(--accent); }
        .time-badge { font-family: monospace; font-size: 14px; font-weight: 700; color: #00e1ff; background: #06090e; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); }

        .btn-submit { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent), var(--accent-hover)); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; box-shadow: 0 8px 24px var(--accent-glow); }
        .btn-submit:hover { transform: translateY(-2px); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .progress-box { display: none; margin-top: 20px; padding: 16px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 10px; }
        .progress-bar-fill { width: 0%; height: 8px; background: linear-gradient(90deg, var(--accent), #10b981); border-radius: 4px; transition: width 0.2s; }

        .result-box { display: none; margin-top: 24px; padding: 20px; background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; }
        .download-btn { display: block; text-align: center; padding: 14px; background: #10b981; color: #fff; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 800; }

        footer { background: var(--bg-card); border-top: 1px solid var(--border-color); padding: 20px; text-align: center; font-size: 12px; color: var(--text-muted); }
        footer span { color: var(--accent); font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <video src="site_logo.webm" class="header-logo" autoplay loop muted playsinline></video>
            <h1>MCEYS TRIM STUDİO</h1>
        </a>
        <div class="header-right">
            <nav class="nav-pill-group">
                <a href="index.html" class="nav-link" data-i18n="nav_home">Ana Sayfa</a>
                <a href="studio.html" class="nav-link" data-i18n="nav_studio">CS2 Shorts</a>
                <a href="trim.html" class="nav-link active" data-i18n="nav_trim">Kayıpsız Kesici</a>
            </nav>
            <span class="header-divider"></span>
            <div class="lang-switch">
                <button class="lang-btn active" id="btn-lang-tr" onclick="setTrimLang('tr')">TR</button>
                <button class="lang-btn" id="btn-lang-en" onclick="setTrimLang('en')">EN</button>
                <button class="lang-btn" id="btn-lang-de" onclick="setTrimLang('de')">DE</button>
                <button class="lang-btn" id="btn-lang-ru" onclick="setTrimLang('ru')">RU</button>
            </div>
        </div>
    </header>

    <main>
        <div class="editor-container">
            <h2 class="trim-title" style="font-size: 20px; font-weight: 900; margin-bottom: 6px; text-align: center;" data-i18n="title">Canlı Önizlemeli Video Kesici</h2>
            <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px;" data-i18n="desc">Videoyu timeline üzerinde oynat, kesmek istediğin başlangıç ve bitiş anını tek tıkla seç.</p>

            <label class="custom-file-upload" for="t-video" id="upload-box">
                <span style="font-size: 32px;">🎞️</span>
                <span id="t-file-name" style="font-weight: 700;" data-i18n="upload_title">Video Dosyası Yükle</span>
                <span style="font-size: 11px; color: var(--text-muted);" data-i18n="upload_hint">MP4, MOV veya MKV</span>
                <input type="file" id="t-video" class="hidden-file-input" accept="video/mp4,video/quicktime,video/mkv" onchange="loadVideoWorkspace(this)">
            </label>

            <!-- Video Workspace -->
            <!-- Video Workspace -->
            <div id="workspace" class="workspace">
                <div class="player-frame">
                    <video id="preview-player" controls playsinline style="cursor: pointer;" onclick="togglePlay()"></video>
                </div>

                <div class="timeline-controls">
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                        <button type="button" class="marker-btn" id="btn-play-pause" onclick="togglePlay()" style="padding: 6px 14px; font-size: 14px;">▶️ Oynat</button>
                        <input type="range" id="timeline-scrubber" class="timeline-slider" min="0" value="0" step="0.05" oninput="onScrub(this.value)" style="margin-bottom: 0; flex: 1;">
                    </div>
                    
                    <div class="time-markers">
                        <div class="marker-group">
                            <button class="marker-btn" type="button" onclick="setMarker('start')" data-i18n="btn_start">⏱️ Başlangıç Seç</button>
                            <span class="time-badge" id="badge-start">00:00.0</span>
                        </div>

                        <div style="font-size: 13px; font-weight: 800; color: var(--text-muted);">
                            <span data-i18n="lbl_dur">Süre:</span> <span id="badge-duration" style="color: #fff;">0.0s</span>
                        </div>

                        <div class="marker-group">
                            <button class="marker-btn" type="button" onclick="setMarker('end')" data-i18n="btn_end">⏱️ Bitiş Seç</button>
                            <span class="time-badge" id="badge-end">00:00.0</span>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn-submit" id="btn-trim" onclick="executeLosslessTrim()" data-i18n="btn_trim">⚡ SEÇİLEN ARALIĞI KAYIPSIZ KES</button>
            </div>
            <div id="progress-box" class="progress-box">
                <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px;">
                    <span id="progress-text">Hazırlanıyor...</span>
                    <span id="progress-percent">%0</span>
                </div>
                <div style="background: #1a1e2b; height: 8px; border-radius: 4px; overflow: hidden;">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
            </div>

            <div id="result-box" class="result-box">
                <div class="player-frame" style="max-height: 320px; margin-bottom: 12px;">
                    <video id="out-player" controls playsinline></video>
                </div>
                <a id="btn-download" class="download-btn" href="#" download="trimmed_video.mp4" data-i18n="btn_dl">🎬 Kesilen Videoyu İndir</a>
            </div>
        </div>
    </main>

    <footer>
        <p>MCEYS TRIM STUDİO &copy; 2026 | <span data-i18n="footer_pres">MCEYS SUNAR</span></p>
    </footer>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });

        const player = document.getElementById('preview-player');
        const scrubber = document.getElementById('timeline-scrubber');
        let selectedFile = null;
        let startTime = 0;
        let endTime = 0;

        const trimDict = {
            tr: {
                nav_home: "Ana Sayfa",
                nav_studio: "CS2 Shorts",
                nav_trim: "Kayıpsız Kesici",
                title: "Canlı Önizlemeli Video Kesici",
                desc: "Videoyu timeline üzerinde oynat, kesmek istediğin başlangıç ve bitiş anını tek tıkla seç.",
                upload_title: "Video Dosyası Yükle",
                upload_hint: "MP4, MOV veya MKV",
                btn_start: "⏱️ Başlangıç Seç",
                btn_end: "⏱️ Bitiş Seç",
                lbl_dur: "Süre:",
                btn_trim: "⚡ SEÇİLEN ARALIĞI KAYIPSIZ KES",
                btn_dl: "🎬 Kesilen Videoyu İndir",
                footer_pres: "MCEYS SUNAR",
                msg_load: "FFmpeg motoru yükleniyor...",
                msg_mem: "Video belleğe aktarılıyor...",
                msg_proc: "Kayıpsız kesim yapılıyor (-c copy)...",
                msg_done: "✔ Tamamlandı!"
            },
            en: {
                nav_home: "Home",
                nav_studio: "CS2 Shorts",
                nav_trim: "Lossless Trimmer",
                title: "Live Preview Video Trimmer",
                desc: "Play the video on timeline, select start and end points with one click.",
                upload_title: "Choose Video File",
                upload_hint: "MP4, MOV or MKV",
                btn_start: "⏱️ Set Start",
                btn_end: "⏱️ Set End",
                lbl_dur: "Duration:",
                btn_trim: "⚡ CUT SELECTED RANGE (LOSSLESS)",
                btn_dl: "🎬 Download Trimmed Video",
                footer_pres: "MCEYS PRESENT",
                msg_load: "Loading FFmpeg engine...",
                msg_mem: "Loading video to memory...",
                msg_proc: "Lossless cutting in progress (-c copy)...",
                msg_done: "✔ Finished!"
            },
            de: {
                nav_home: "Startseite",
                nav_studio: "CS2 Shorts",
                nav_trim: "Verlustfreier Cutter",
                title: "Live-Vorschau Video-Cutter",
                desc: "Spiele das Video auf der Timeline ab und wähle Start- und Endpunkte mit einem Klick.",
                upload_title: "Videodatei Auswählen",
                upload_hint: "MP4, MOV oder MKV",
                btn_start: "⏱️ Start Wählen",
                btn_end: "⏱️ Ende Wählen",
                lbl_dur: "Dauer:",
                btn_trim: "⚡ BEREICH VERLUSTFREI SCHNEIDEN",
                btn_dl: "🎬 Geschnittenes Video Herunterladen",
                footer_pres: "MCEYS PRÄSENTIERT",
                msg_load: "FFmpeg-Engine wird geladen...",
                msg_mem: "Video wird in den Speicher geladen...",
                msg_proc: "Verlustfreier Schnitt läuft (-c copy)...",
                msg_done: "✔ Abgeschlossen!"
            },
            ru: {
                nav_home: "Главная",
                nav_studio: "CS2 Shorts",
                nav_trim: "Без потери качества",
                title: "Видео-триммер с живым предпросмотром",
                desc: "Воспроизводите видео на таймлайне и выбирайте начало и конец в один клик.",
                upload_title: "Выберите видеофайл",
                upload_hint: "MP4, MOV или MKV",
                btn_start: "⏱️ Точка начала",
                btn_end: "⏱️ Точка конца",
                lbl_dur: "Длительность:",
                btn_trim: "⚡ ВЫРЕЗАТЬ БЕЗ ПОТЕРИ КАЧЕСТВА",
                btn_dl: "🎬 Скачать готовое видео",
                footer_pres: "MCEYS ПРЕДСТАВЛЯЕТ",
                msg_load: "Загрузка движка FFmpeg...",
                msg_mem: "Загрузка видео в память...",
                msg_proc: "Выполняется быстрая обрезка (-c copy)...",
                msg_done: "✔ Завершено!"
            }
        };

        let currentLang = localStorage.getItem('mceys_trim_lang') || 'tr';

        function setTrimLang(lang) {
            currentLang = lang;
            localStorage.setItem('mceys_trim_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn-lang-' + lang);
            if (btn) btn.classList.add('active');

            const dict = trimDict[lang];
            if (!dict) return;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (k === 'upload_title' && selectedFile) return;
                if (dict[k]) el.innerText = dict[k];
            });
        }

        function fmtTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            const ms = Math.floor((sec % 1) * 10);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${ms}`;
        }

        function loadVideoWorkspace(input) {
            if (!input.files || !input.files[0]) return;
            selectedFile = input.files[0];

            document.getElementById('t-file-name').innerText = "✔ " + selectedFile.name;
            document.getElementById('t-file-name').style.color = "var(--success)";

            player.src = URL.createObjectURL(selectedFile);
            player.onloadedmetadata = () => {
                document.getElementById('workspace').style.display = 'block';
                scrubber.max = player.duration;
                startTime = 0;
                endTime = player.duration;
                updateBadges();
            };

            player.ontimeupdate = () => {
                scrubber.value = player.currentTime;
            };
        }

        function onScrub(val) {
            player.currentTime = parseFloat(val);
        }

function togglePlay() {
            const btn = document.getElementById('btn-play-pause');
            if (player.paused || player.ended) {
                player.play();
                if (btn) btn.innerText = "⏸️ Duraklat";
            } else {
                player.pause();
                if (btn) btn.innerText = "▶️ Oynat";
            }
        }

        player.onplay = () => {
            const btn = document.getElementById('btn-play-pause');
            if (btn) btn.innerText = "⏸️ Duraklat";
        };

        player.onpause = () => {
            const btn = document.getElementById('btn-play-pause');
            if (btn) btn.innerText = "▶️ Oynat";
        };

        function setMarker(type) {
            if (type === 'start') {
                startTime = Math.min(player.currentTime, endTime - 0.2);
            } else {
                endTime = Math.max(player.currentTime, startTime + 0.2);
            }
            updateBadges();
        }

        function updateBadges() {
            document.getElementById('badge-start').innerText = fmtTime(startTime);
            document.getElementById('badge-end').innerText = fmtTime(endTime);
            const diff = Math.max(0, endTime - startTime);
            document.getElementById('badge-duration').innerText = diff.toFixed(1) + 's';
        }

        async function executeLosslessTrim() {
            if (!selectedFile) return;
            const dict = trimDict[currentLang];

            const btn = document.getElementById('btn-trim');
            const pBox = document.getElementById('progress-box');
            const pFill = document.getElementById('progress-fill');
            const pText = document.getElementById('progress-text');
            const pPct = document.getElementById('progress-percent');
            const rBox = document.getElementById('result-box');

            btn.disabled = true;
            rBox.style.display = 'none';
            pBox.style.display = 'block';
            pFill.style.width = '25%';
            pPct.innerText = '%25';
            pText.innerText = dict.msg_load;

            try {
                if (!ffmpeg.isLoaded()) {
                    await ffmpeg.load();
                }

                pFill.style.width = '55%';
                pPct.innerText = '%55';
                pText.innerText = dict.msg_mem;
                ffmpeg.FS('writeFile', 'src.mp4', await fetchFile(selectedFile));

                pFill.style.width = '85%';
                pPct.innerText = '%85';
                pText.innerText = dict.msg_proc;

                const duration = endTime - startTime;
                await ffmpeg.run(
                    '-ss', `${startTime.toFixed(2)}`,
                    '-i', 'src.mp4',
                    '-t', `${duration.toFixed(2)}`,
                    '-c', 'copy',
                    'cut_result.mp4'
                );

                const data = ffmpeg.FS('readFile', 'cut_result.mp4');
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const outName = `clip_${Date.now()}.mp4`;

                pFill.style.width = '100%';
                pPct.innerText = '%100';
                pText.innerText = dict.msg_done;

                document.getElementById('out-player').src = url;
                const dl = document.getElementById('btn-download');
                dl.href = url;
                dl.download = outName;

                rBox.style.display = 'block';
            } catch (err) {
                console.error(err);
                alert("Hata: " + err.message);
            } finally {
                btn.disabled = false;
            }
        }

        setTrimLang(currentLang);
    </script>
</body>
</html>
